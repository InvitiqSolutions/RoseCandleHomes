<header class="main-header">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand" routerLink="/">
        <img src="/images/logo.png" alt="Logo" />
        <span></span>
      </a>

      <!-- Mobile Toggle -->
      <button class="navbar-toggler" type="button" (click)="toggleNavbar()" [attr.aria-expanded]="isNavbarOpen"
        aria-controls="navbar" aria-label="Toggle navigation">
        <i class="fas" [class.fa-bars]="!isNavbarOpen" [class.fa-xmark]="isNavbarOpen">
        </i>
      </button>

      <div class="navbar-collapse" id="navbar" [class.show]="isNavbarOpen">
        <!-- Center Navigation -->

        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeNavbar()">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="closeNavbar()">
              About
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/service" routerLinkActive="active" (click)="closeNavbar()">
              Services
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/contact" routerLinkActive="active" (click)="closeNavbar()">
              Contact
            </a>
          </li>
        </ul>

        <!-- Right Button -->

        <a routerLink="/contact" class="contact-btn" (click)="closeNavbar()">
          Contact Us

          <i class="fas fa-arrow-right ms-2"></i>
        </a>
      </div>
    </div>
  </nav>
</header>
